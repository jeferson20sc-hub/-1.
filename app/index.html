<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/senai-cba/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00529b" />
    <meta
      name="description"
      content="Sistema profissional de gestão de estoque do SENAI com sincronização Excel Online via Power Automate."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SENAI · Gestão de Estoque LIS</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        background: #0b1220;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        color: #cbd5e1;
        background: radial-gradient(ellipse at top, #1e293b, #0b1220);
      }
      .splash-mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #00529b, #003f78);
        box-shadow: 0 18px 48px rgba(0, 82, 155, 0.45);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-mark" aria-label="Carregando"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
